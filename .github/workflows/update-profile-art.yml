name: Update profile art

# Refreshes the contribution graph SVG daily from real data, and rebuilds the
# ASCII portrait whenever source-photo.* changes.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ---- portrait: only rebuilt when the uploaded photo changes ----------
      - name: Check for a new source photo
        id: photo
        run: |
          photo=$(ls source-photo.* 2>/dev/null | head -n 1 || true)
          if [ -z "$photo" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sum=$(sha256sum "$photo" | cut -d' ' -f1)
          if [ "$sum" = "$(cat data/portrait.sha256 2>/dev/null)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "photo=$photo" >> "$GITHUB_OUTPUT"
            echo "sum=$sum" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild ASCII portrait
        if: steps.photo.outputs.changed == 'true'
        run: |
          pip install -r scripts/requirements-portrait.txt
          python scripts/prep_photo.py "${{ steps.photo.outputs.photo }}"
          python scripts/make_ascii_svg.py
          mkdir -p data
          echo "${{ steps.photo.outputs.sum }}" > data/portrait.sha256

      # ---- contribution graph: refreshed every run --------------------------
      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data *.svg $(ls source-prepped.png 2>/dev/null)
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "chore: refresh profile art [skip ci]"
          git push
